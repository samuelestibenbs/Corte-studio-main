services:
  - type: web
    name: corte-studio-api-spring
    runtime: docker
    region: oregon
    plan: free
    dockerfilePath: ./barberia-backend-spring/Dockerfile
    dockerContext: ./barberia-backend-spring
    healthCheckPath: /api/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAILS
        sync: false
      - key: APP_CORS_ALLOWED_ORIGINS
        value: https://corte-studio-web.onrender.com

  - type: web
    name: corte-studio-web
    runtime: static
    buildCommand: npm ci && npm run build -- --configuration production
    staticPublishPath: ./dist/corte-studio/browser
    routes:
      - type: rewrite
        source: /*
        destination: /index.html