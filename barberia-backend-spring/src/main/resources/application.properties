spring.application.name=corte-studio-api
server.port=${PORT:8080}
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/corte_studio}
spring.data.mongodb.auto-index-creation=true
app.jwt-secret=${JWT_SECRET:local-development-only-secret-key-0123456789}
app.admin-emails=${ADMIN_EMAILS:}
app.cors-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:4200,http://127.0.0.1:4200}